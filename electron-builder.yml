# Configuración base de empaquetado (electron-builder).
#
# Nota de privilegios (design.md, decisión ya tomada): la aplicación se empaqueta
# con manifest `asInvoker`, NUNCA `requireAdministrator`. El grueso de la app
# (escaneo, UI, detección de rutas, listado de VPK) no necesita privilegios; la
# elevación se dispara SOLO bajo demanda para las escrituras en el Game_Root,
# gestionada en tiempo de ejecución por el ElevationService (tarea 17).
#
# Esta config es un esqueleto coherente para la Tarea 1: no pretende producir un
# build de producción completo (eso llega con la UI y el bundling del renderer).

appId: com.dcestudios.s1mpleversusloader
productName: S1mple Versus Loader
copyright: Copyright © DCE Studios For EITO Comunity

directories:
  output: release
  buildResources: build

# Empaquetamos la salida compilada, renderer y manifest
files:
  - dist/**/*
  - package.json
  - resources/**/*

extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"

win:
  requestedExecutionLevel: asInvoker
  target:
    - nsis
    - dir

linux:
  target:
    - AppImage
    - tar.gz
  category: Game

# better-sqlite3 es un módulo nativo: electron-builder lo reconstruye contra el
# runtime de Electron durante el empaquetado.
npmRebuild: true
